[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reporepair"
version = "0.1.0"
description = "RepoRepair-Lab: coding agent harness with verifiable feedback"
requires-python = ">=3.10"
dependencies = [
    "mini-swe-agent>=2.4.6",
    "pydantic>=2.0",
    "pyyaml",
    "jinja2",
]

[project.scripts]
rrl-run = "reporepair.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["reporepair*"]
